    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && typeof desc.get === 'function' && !desc.set && desc.configurable) {
            var origGet = desc.get;
            var customFetch = null;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: Boolean(desc.enumerable),
              get: function () {
                return customFetch || origGet.call(this);
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  customFetch = fn;
                }
              },
            });
          }
        } catch (_err) {}

        function isExtensionSource(str) {
          return (
            typeof str === 'string' &&
            (str.indexOf('chrome-extension://') !== -1 ||
              str.indexOf('moz-extension://') !== -1 ||
              str.indexOf('safari-extension://') !== -1)
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            var stack = event && event.error && event.error.stack;
            if (event && (isExtensionSource(event.filename) || isExtensionSource(stack))) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var stack = reason && reason.stack;
            if (isExtensionSource(stack)) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
            }
          },
          true
        );
      })();
    </script>
